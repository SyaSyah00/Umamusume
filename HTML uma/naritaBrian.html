<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narita Brian</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div data-include="../components/header.html"></div>

    <section class="character-detail py-5" style="margin-top: 80px;">
        <div class="container">
            <div class="row align-items-center g-4">
                <div class="col-lg-5">
                    <img src="../img/Narita Brian.jfif" alt="Narita Brian" class="img-fluid rounded-lg shadow-lg">
                </div>
                <div class="col-lg-7">
                    <h1 class="fw-bold mb-3" style="color: #00d4ff;">Narita Brian</h1>
                    <p class="text-light mb-4">Intelligent runner focused on strategy and wit. High intelligence and power are key stats for this character. Build around wit and power sparks for optimal results in complex race scenarios.</p>
                    </p>
                    <h1 class="text-center fw-bold mb-2">Recomendation stats</h1>
                    <div class="attributes-table" style="margin-top: 2rem;">
                        <div style="display: flex; gap: 1rem; justify-content: space-between;">
                            <div class="attr-box" style="flex: 1; background: rgba(0, 212, 255, 0.15); border: 2px solid rgba(0, 212, 255, 0.4); border-radius: 10px; padding: 1.5rem; text-align: center;">
                                <img src="../icon/speed.png" alt="Speed" style="width: 48px; height: 48px; object-fit: contain; margin: 0 auto 0.5rem; display: block;">
                                <p style="color: #b0b0b0; font-size: 0.85rem; margin-bottom: 0.5rem;">Speed</p>
                                <p style="color: #00d4ff; font-weight: bold;">900</p>
                            </div>
                            <div class="attr-box" style="flex: 1; background: rgba(0, 212, 255, 0.15); border: 2px solid rgba(0, 212, 255, 0.4); border-radius: 10px; padding: 1.5rem; text-align: center;">
                                <img src="../icon/stamina.png" alt="Stamina" style="width: 48px; height: 48px; object-fit: contain; margin: 0 auto 0.5rem; display: block;">
                                <p style="color: #b0b0b0; font-size: 0.85rem; margin-bottom: 0.5rem;">Stamina</p>
                                <p style="color: #00d4ff; font-weight: bold;">800</p>
                            </div>
                            <div class="attr-box" style="flex: 1; background: rgba(0, 212, 255, 0.15); border: 2px solid rgba(0, 212, 255, 0.4); border-radius: 10px; padding: 1.5rem; text-align: center;">
                                <img src="../icon/power.png" alt="Power" style="width: 48px; height: 48px; object-fit: contain; margin: 0 auto 0.5rem; display: block;">
                                <p style="color: #b0b0b0; font-size: 0.85rem; margin-bottom: 0.5rem;">Power</p>
                                <p style="color: #00d4ff; font-weight: bold;">1100</p>
                            </div>
                            <div class="attr-box" style="flex: 1; background: rgba(0, 212, 255, 0.15); border: 2px solid rgba(0, 212, 255, 0.4); border-radius: 10px; padding: 1.5rem; text-align: center;">
                                <img src="../icon/guts.png" alt="Guts" style="width: 48px; height: 48px; object-fit: contain; margin: 0 auto 0.5rem; display: block;">
                                <p style="color: #b0b0b0; font-size: 0.85rem; margin-bottom: 0.5rem;">Guts</p>
                                <p style="color: #00d4ff; font-weight: bold;">700</p>
                            </div>
                            <div class="attr-box" style="flex: 1; background: rgba(0, 212, 255, 0.15); border: 2px solid rgba(0, 212, 255, 0.4); border-radius: 10px; padding: 1.5rem; text-align: center;">
                                <img src="../icon/wit.png" alt="Intelligence" style="width: 48px; height: 48px; object-fit: contain; margin: 0 auto 0.5rem; display: block;">
                                <p style="color: #b0b0b0; font-size: 0.85rem; margin-bottom: 0.5rem;">Wit</p>
                                <p style="color: #00d4ff; font-weight: bold;">1300</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div data-include="../components/footer.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../script.js"></script>
</body>
</html>
